name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write  # sigstore keyless signing

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # `console/dist` is embedded into the binary at compile time and is
      # gitignored, so a fresh checkout has none. Without this the build
      # falls back to the placeholder page in `router-server/build.rs`
      # and the release ships a gateway whose console is a paragraph
      # explaining that the console was not built. CI already does this
      # before its cargo steps; a release that does not is the only build
      # anyone actually downloads getting it wrong.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: console
      - run: npm run build
        working-directory: console
      - run: cargo build --release --target ${{ matrix.target }} -p router-bin
      - name: Package
        run: |
          NAME=rapid-router-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$NAME"
          cp target/${{ matrix.target }}/release/rapid-router "$NAME/"
          tar czf "$NAME.tar.gz" "$NAME"
          shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: rapid-router-*.tar.gz*

  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: rapid-router-${{ github.ref_name }}.sbom.spdx.json
      - name: Sign artifacts (sigstore keyless)
        uses: sigstore/cosign-installer@v3
      - run: |
          for f in rapid-router-*.tar.gz; do
            cosign sign-blob --yes "$f" \
              --output-signature "$f.sig" \
              --output-certificate "$f.pem"
          done
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rapid-router-*.tar.gz
            rapid-router-*.tar.gz.sha256
            rapid-router-*.tar.gz.sig
            rapid-router-*.tar.gz.pem
            rapid-router-*.sbom.spdx.json
          generate_release_notes: true
