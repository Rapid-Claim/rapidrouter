name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The console bundle is embedded into the binary at compile time and
      # is gitignored, so without this step the gateway under test serves
      # an empty console and the test that checks it serves the real one
      # fails — which it had been doing.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: console
      - run: npm run build
        working-directory: console
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Every backend through the same suite, S3 and DynamoDB over their
      # real wire protocols against in-process doubles.
      - name: Backend conformance (memory, file, S3, DynamoDB)
        run: cargo test -p router-store --test backends --release
      - name: Store facade (CAS, caching, cross-node secrets)
        run: cargo test -p router-store --test store --release
      - name: Fleet behavior (propagation, shares, store outage)
        run: cargo test -p router-server --test fleet --release

  loom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Model-check breaker and token bucket
        run: RUSTFLAGS="--cfg loom" cargo test -p router-core --test loom_models --release

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: console
      - run: npm run typecheck && npm run build
        working-directory: console
      - run: npx playwright install --with-deps chromium
        working-directory: console
      - run: npm run test:e2e
        working-directory: console
      - name: Enforce compressed JavaScript budget
        run: npm run budget
        working-directory: console
      - name: Console builds out of the Rust tree too
        run: cargo build -p router-server --no-default-features

  sdk-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official SDKs
        run: |
          python -m venv /tmp/sdkvenv
          /tmp/sdkvenv/bin/pip install --quiet openai anthropic
      - name: Run SDK scenario suites against gateway + mock
        run: scripts/sdk-suite/run.sh /tmp/sdkvenv/bin/python

  perf-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Micro benches compile and run
        run: cargo bench --workspace -- --test
      - name: Overhead gate (generous bounds for shared CI runners)
        run: cargo run --release -p rig -- overhead --rps 200 --secs 5 --assert-p50-us 400 --assert-p99-us 4000
      - name: Short soak, flat memory gate
        run: cargo run --release -p rig -- soak --secs 20 --rps 100 --assert-rss-growth-pct 40

  musl-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl -p router-bin

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked || true
      - run: cargo audit

  # Runs the conformance shapes against REAL provider APIs. Requires
  # provider keys as repository secrets; each test skips gracefully when
  # its key is absent, so partial key sets are fine. Triggered manually
  # (workflow_dispatch) and on main pushes when secrets are configured.
  live-validation:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LIVE_OPENAI_MODEL: ${{ vars.LIVE_OPENAI_MODEL }}
      LIVE_ANTHROPIC_MODEL: ${{ vars.LIVE_ANTHROPIC_MODEL }}
      LIVE_GEMINI_MODEL: ${{ vars.LIVE_GEMINI_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate against live providers (skips per missing key)
        run: cargo test -p router-server --test live_validation -- --ignored --nocapture
