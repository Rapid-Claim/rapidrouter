[package]
name = "router-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arc-swap = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
crc32fast = { workspace = true }
fastrand = { workspace = true }
memchr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
zeroize = { workspace = true }
tokio = { version = "1", default-features = false, features = ["sync"] }
argon2 = "0.5.3"
# `OsRng` lives behind rand_core's `getrandom` feature. Argon2 pulls
# rand_core in but not that feature, so in a workspace build it only
# compiled because some other crate happened to enable it — and building
# this crate alone (as the loom job does) failed. Depending on it here
# makes the salt source a property of this crate rather than of whatever
# else is being built alongside it.
rand_core = { version = "0.6.4", features = ["getrandom"] }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "micro"
harness = false

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
