[workspace]
resolver = "3"
members = [
    "crates/router-core",
    "crates/router-media",
    "crates/router-providers",
    "crates/router-server",
    "crates/router-store",
    "crates/router-bin",
    "crates/mock-provider",
    "crates/rig",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ashutoshxkd/rapidrouter"

[workspace.dependencies]
router-core = { path = "crates/router-core" }
router-media = { path = "crates/router-media" }
mock-provider = { path = "crates/mock-provider" }
router-providers = { path = "crates/router-providers" }
router-server = { path = "crates/router-server" }
router-store = { path = "crates/router-store" }

arc-swap = "1"
axum = "0.8"
base64 = "0.22"
hayro = "0.7"
png = "0.18"
blake3 = "1"
bytes = "1"
chacha20poly1305 = "0.10"
libc = "0.2"
rust-embed = "8"
zstd = "0.13"
clap = { version = "4", features = ["derive", "env"] }
fastrand = "2"
futures-util = { version = "0.3", default-features = false }
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "webpki-roots", "tls12"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
criterion = { version = "0.5", default-features = false }
hdrhistogram = "7"
crc32fast = "1"
hmac = "0.12"
memchr = "2"
sha2 = "0.10"
mimalloc = "0.1"
proptest = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "cookies"] }
uuid = { version = "1", features = ["v7"] }
http = "1"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
zeroize = "1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
